name: Build heltec v3 Companion Firmware

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    tags:
      - 'companion-*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clone Repo
        uses: actions/checkout@v4

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      - name: Build Firmwares
        env:
          FIRMWARE_VERSION: ${{ github.ref_name }}
        run: |
          bash build.sh build-firmware Heltec_v3_companion_radio_ble
          mkdir -p out
          cp .pio/build/Heltec_v3_companion_radio_ble/firmware*.bin out/
          cp .pio/build/Heltec_v3_companion_radio_ble/firmware*.elf out/ || true

      - name: Upload Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: companion-firmware
          path: out/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Companion Firmware ${{ github.ref_name }}
          body: ""
          draft: true
          files: out/*
